spring:
  application:
    name: portfolio

  security:
    user:
      name: ${SPRING_SECURITY_USERNAME}
      password: ${SPRING_SECURITY_PASSWORD}

  data:
    mongodb:
      uri: ${MONGO_URI}
      database: ${MONGO_DATABASE}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${APP_USERNAME}
    password: ${APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

MYMAIL: ${MYMAIL}
FrontEndURL: ${FrontEndURL}
